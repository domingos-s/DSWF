<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#171717" />
  <meta name="description" content="Track peaceful family streaks, reflect after conflict, and learn from relationship patterns privately on-device." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="journal.css" />
  <link rel="stylesheet" href="insights.css" />
  <title>Days Since We Fought</title>
</head>
<body>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
  <script src="journal.js" defer></script>
  <script src="insights.js" defer></script>
  <script src="insights-extra.js" defer></script>
  <script src="leaderboard.js" defer></script>
  <script src="version.js" defer></script>
  <script defer>
    window.addEventListener('load', () => {
      const renderInsightProgress = () => {
        const hub = document.querySelector('#insightsHub');
        if (!hub || hub.querySelector('.insight-card-stack')) return;
        const empty = hub.querySelector('.insight-empty');
        if (!empty || typeof state === 'undefined') return;
        const count = Array.isArray(state.journalEntries) ? state.journalEntries.length : 0;
        const remaining = Math.max(0, 3 - count);
        empty.innerHTML = `<div class="journal-hub-copy"><span class="journal-icon">💡</span><div><strong>Building your insights…</strong><small>${count} reflection${count === 1 ? '' : 's'} recorded. ${remaining ? `Initial pattern detection begins after ${remaining} more reflection${remaining === 1 ? '' : 's'}.` : 'DSWF has enough entries to test for patterns, but none meet the evidence thresholds yet.'}</small></div></div><div style="min-width:120px;text-align:right"><strong style="display:block;font-size:13px">${Math.min(count,3)} / 3</strong><small style="display:block;color:var(--muted);font-size:10px">toward initial patterns</small></div>`;
      };
      const observer = new MutationObserver(renderInsightProgress);
      observer.observe(document.querySelector('#app'), { childList: true, subtree: true });
      renderInsightProgress();
    });
  </script>
</body>
</html>
